<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>财务中心记账工作台演示版</title>
  <link rel="stylesheet" href="assets/finance-center.css?v=20260611-rename2" />
  <link rel="stylesheet" href="assets/finance-dashboard.css?v=20260611-rename2" />
  <link rel="stylesheet" href="assets/finance-voucher-preview.css?v=20260611-rename2" />
  <link rel="stylesheet" href="assets/finance-responsive.css?v=20260611-rename2" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">财</span><span>财务中心记账工作台</span></div>
      <div class="nav-scroll" id="nav"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn menu-toggle" data-action="toggle-sidebar">菜单</button>
        <div class="breadcrumb" id="breadcrumb">财务中心 / 资金账变总览</div>
        <input class="global-search" id="globalSearch" type="search" placeholder="全局搜索：模板、科目、业务单、凭证号" />
        <select class="top-select" id="priorityFilter" title="优先级">
          <option value="">全部优先级</option>
          <option>P0</option>
          <option>P1</option>
          <option>P2</option>
        </select>
        <select class="top-select" id="statusFilter" title="状态">
          <option value="">全部状态</option>
          <option>原型已补齐</option>
          <option>后端待落地</option>
          <option>需确认</option>
          <option>待清算</option>
          <option>已清算</option>
          <option>已入账</option>
          <option>差异</option>
        </select>
        <div class="topbar-spacer"></div>
      </header>
      <section class="content">
        <div class="page" id="app"></div>
      </section>
    </main>
  </div>
  <div class="drawer-backdrop" id="drawerBackdrop" data-action="close-drawer"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 class="drawer-title" id="drawerTitle">详情</h2>
      <button class="btn" data-action="close-drawer">关闭</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <div class="toast" id="toast"></div>
  <script src="assets/finance-data.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-ledger-definitions.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-state.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-state-seeds.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-render-ledgers.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-render-reconciliation.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-render-dashboard.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-render-config.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-render-reports.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-tables-utils.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-report-constants.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-reports-utils.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-finance-stats.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-template-editor.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-metrics.js?v=20260611-rename2"></script>
  <script src="assets/finance-app-actions.js?v=20260611-rename2"></script>
  <script src="assets/finance-bootstrap.js?v=20260611-rename2"></script>
</body>
</html>
